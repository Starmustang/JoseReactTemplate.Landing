<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>OG card — N. Florentino software</title>
    <!--
      Source for public/og-image.jpg, the card WhatsApp/Slack/Facebook show when
      the landing page is shared. Regenerate it by screenshotting this file in a
      viewport of exactly 1200x630, e.g.:

        npx playwright screenshot --viewport-size=1200,630 \
          --wait-for-timeout=2000 scripts/og-image.html public/og-image.jpg

      The screenshot on the right is public/videos/brag.jpg, cropped in CSS to
      the odontogram panel (source region x=800 y=210 w=1020 h=650 of 1920x1080).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background: #1c2733;
        color: #e8eef2;
        position: relative;
      }

      /* The same soft accent halo the walkthrough frames bloom behind their panels. */
      .glow {
        position: absolute;
        top: -320px;
        right: -220px;
        width: 1040px;
        height: 1040px;
        background: radial-gradient(
          closest-side,
          rgba(61, 156, 176, 0.26),
          rgba(61, 156, 176, 0.06) 58%,
          transparent 100%
        );
        filter: blur(24px);
      }

      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 52px;
        height: 100%;
        padding: 0 64px 0 72px;
      }

      .copy {
        width: 452px;
        flex: none;
      }

      .brand-name {
        display: block;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1.1;
      }

      .brand-suffix {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #a6b2c0;
      }

      h1 {
        margin-top: 30px;
        font-size: 39px;
        font-weight: 800;
        line-height: 1.14;
        letter-spacing: -0.015em;
      }

      .rule {
        width: 88px;
        height: 3px;
        margin: 26px 0 22px;
        border-radius: 2px;
        background: #3d9cb0;
      }

      .sub {
        font-size: 17px;
        font-weight: 500;
        line-height: 1.55;
        color: #a6b2c0;
      }

      .shot {
        position: relative;
        width: 560px;
        height: 357px;
        overflow: hidden;
        border: 1px solid #33414f;
        border-radius: 14px;
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.45);
      }

      /* public/videos/brag.jpg is 1920x1080; this shows its x=800 y=210 w=1020 h=650 region. */
      .shot img {
        display: block;
        width: 1054px;
        margin: -115px 0 0 -439px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="card">
      <div class="copy">
        <span class="brand-name">N. Florentino</span>
        <span class="brand-suffix">software</span>
        <h1>Todo el consultorio.<br />Un solo sistema.</h1>
        <div class="rule"></div>
        <p class="sub">
          Pacientes, doctores, citas y tratamientos en un solo lugar — con un bot de Telegram que
          agenda solo.
        </p>
      </div>
      <div class="shot">
        <img src="../public/videos/brag.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
