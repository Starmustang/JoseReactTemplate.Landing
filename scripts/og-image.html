<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>OG card — N. Florentino software</title>
    <!--
      Source for public/og-image.jpg, the card WhatsApp/Slack/Facebook show when
      the landing page is shared. Regenerate it by screenshotting this file in a
      viewport of exactly 1200x630 with the scratch Playwright/Edge script:

        node E:\Trabajos\JoseReactTemplate\.scratch\pw\shot.js \
          "file:///E:/Trabajos/JoseReactTemplate/JoseReactTemplate.Landing/scripts/og-image.html" \
          "E:\Trabajos\JoseReactTemplate\.scratch\og.png" 1200 630
        ffmpeg -y -i .scratch\og.png -q:v 3 public\og-image.jpg

      The screenshot on the right is public/videos/brag.jpg, cropped in CSS to
      the odontogram panel (source region x=800 y=210 w=1020 h=650 of 1920x1080).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        font-family: 'Source Sans 3', 'Helvetica', 'Arial', sans-serif;
        background: #faf7f2;
        color: #1e2a33;
      }

      .card {
        display: flex;
        align-items: center;
        gap: 52px;
        height: 100%;
        padding: 0 64px 0 72px;
      }

      .copy {
        width: 452px;
        flex: none;
      }

      .brand-name {
        display: block;
        font-family: 'Newsreader', 'Georgia', serif;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.1;
      }

      .brand-suffix {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #56626c;
      }

      h1 {
        margin-top: 34px;
        font-family: 'Newsreader', 'Georgia', serif;
        font-size: 44px;
        font-weight: 500;
        line-height: 1.12;
        letter-spacing: -0.015em;
      }

      h1 em {
        font-style: italic;
        font-weight: 500;
        color: #1a5864;
      }

      .sub {
        margin-top: 24px;
        font-size: 17px;
        font-weight: 400;
        line-height: 1.55;
        color: #56626c;
      }

      .shot {
        position: relative;
        width: 560px;
        height: 357px;
        overflow: hidden;
        border: 1px solid #e7e0d5;
        border-radius: 16px;
        background: #1c2733;
        box-shadow:
          0 1px 2px rgba(30, 42, 51, 0.06),
          0 12px 32px rgba(30, 42, 51, 0.1);
      }

      /* public/videos/brag.jpg is 1920x1080; this shows its x=800 y=210 w=1020 h=650 region. */
      .shot img {
        display: block;
        width: 1054px;
        margin: -115px 0 0 -439px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="copy">
        <span class="brand-name">N. Florentino</span>
        <span class="brand-suffix">software</span>
        <h1>Menos tiempo al teléfono.<br /><em>Más tiempo con sus pacientes.</em></h1>
        <p class="sub">
          Agenda, fichas y odontograma — y sus pacientes reservan solos por Telegram.
        </p>
      </div>
      <div class="shot">
        <img src="../public/videos/brag.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
